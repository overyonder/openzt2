name: Native builds
on:
  workflow_dispatch:
    inputs:
      target:
        description: Release target to build, or all
        default: all
        type: string
  push:
    branches: [dev]
    tags: ['v[0-9]*']
  pull_request:
    branches: [dev]
  schedule:
    - cron: '0 16 * * *'

concurrency:
  group: native-builds-${{ github.ref }}-${{ inputs.target || 'all' }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/dev' || github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.development.outputs.build }}
      matrix: ${{ steps.targets.outputs.matrix }}
      rust: ${{ steps.targets.outputs.rust }}
      alpine_image: ${{ steps.targets.outputs.alpine_image }}
      wix_version: ${{ steps.targets.outputs.wix_version }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Select development build
        id: development
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build=true
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            previous=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-builds.yml/runs?branch=dev&status=success&per_page=20" \
              --jq '[.workflow_runs[] | select(.event == "push" or .event == "schedule")][0].head_sha // empty')
            if [[ "$previous" == "$GITHUB_SHA" ]]; then build=false; fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - id: targets
        run: python3 tools/release/release_targets.py matrix --target '${{ inputs.target || 'all' }}'

  package:
    needs: targets
    if: needs.targets.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    environment: ${{ github.ref_type == 'tag' && 'release' || 'development' }}
    env:
      OPENZT2_RELEASE_HOST: '1'
      OPENZT2_RUST_VERSION: ${{ needs.targets.outputs.rust }}
      CARGO_BUILD_JOBS: ${{ matrix.id == 'darwin-arm64' && '2' || '4' }}
      CARGO_INCREMENTAL: '0'
      DOTNET_ROLL_FORWARD: Major
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Configure release target
        run: python3 tools/release/release_targets.py environment '${{ matrix.id }}'
      - name: Require signing credentials for tagged installers
        if: github.ref_type == 'tag'
        env:
          OPENZT2_MSIX_CERTIFICATE_BASE64: ${{ github.ref_type == 'tag' && secrets.OPENZT2_MSIX_CERTIFICATE_BASE64 || '' }}
          OPENZT2_MSIX_CERTIFICATE_PASSWORD: ${{ github.ref_type == 'tag' && secrets.OPENZT2_MSIX_CERTIFICATE_PASSWORD || '' }}
          OPENZT2_MSIX_PUBLISHER: ${{ github.ref_type == 'tag' && vars.OPENZT2_MSIX_PUBLISHER || '' }}
          OPENZT2_APK_SIGNING_KEY_BASE64: ${{ github.ref_type == 'tag' && secrets.OPENZT2_APK_SIGNING_KEY_BASE64 || '' }}
        run: |
          if [[ '${{ matrix.id }}' == windows-amd64 ]]; then
            : "${OPENZT2_MSIX_CERTIFICATE_BASE64:?MSIX signing certificate is required}"
            : "${OPENZT2_MSIX_CERTIFICATE_PASSWORD:?MSIX signing password is required}"
            : "${OPENZT2_MSIX_PUBLISHER:?MSIX publisher identity is required}"
          fi
          if [[ '${{ matrix.libc }}' == musl ]]; then
            : "${OPENZT2_APK_SIGNING_KEY_BASE64:?APK signing key is required}"
          fi
      - name: Install pinned Rust
        if: matrix.platform != 'nix' && matrix.libc != 'musl'
        run: |
          rustup toolchain install "$OPENZT2_RUST_VERSION" --profile minimal --target "$OPENZT2_RUST_TARGET"
          rustup override set "$OPENZT2_RUST_VERSION"
      - uses: Swatinem/rust-cache@v2
        if: matrix.platform != 'nix' && matrix.libc != 'musl'
        with:
          prefix-key: release-${{ matrix.id }}
          shared-key: ${{ hashFiles('flake.lock', 'tools/release/targets.toml', 'patches/**') }}
          workspaces: . -> ${{ env.OPENZT2_CARGO_CACHE_TARGET }}
          cache-on-failure: false
      - name: Linux native tools
        if: matrix.platform == 'linux' && matrix.libc == 'glibc'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool flex bison libjson-perl cmake ninja-build pkg-config spirv-headers libvulkan-dev libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libfontconfig1-dev patchelf dpkg-dev mingw-w64-tools rpm libarchive-tools zstd squashfs-tools desktop-file-utils flatpak xz-utils librsvg2-bin
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive --no-related --arch="$OPENZT2_RELEASE_ARCH" flathub "org.freedesktop.Platform//$OPENZT2_FLATPAK_RUNTIME" "org.freedesktop.Sdk//$OPENZT2_FLATPAK_RUNTIME"
          bash tools/release/linux/install-tools.sh "$RUNNER_TEMP/openzt2-packaging" "$OPENZT2_RELEASE_ARCH"
          echo "OPENZT2_LINUX_PACKAGE_TOOLS=$RUNNER_TEMP/openzt2-packaging" >> "$GITHUB_ENV"
      - name: macOS native tools
        if: matrix.platform == 'darwin'
        run: |
          brew install autoconf automake libtool flex bison cmake ninja pkg-config spirv-headers vulkan-headers cpanminus gpatch mingw-w64
          cpanm --local-lib="$RUNNER_TEMP/perl" JSON
          echo "PERL5LIB=$RUNNER_TEMP/perl/lib/perl5" >> "$GITHUB_ENV"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "CPPFLAGS=-I$(brew --prefix)/include" >> "$GITHUB_ENV"
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.platform == 'windows'
        with:
          arch: ${{ matrix.msvc_arch }}
      - name: Select the Visual Studio linker
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $linker = Join-Path $env:VCToolsInstallDir "bin/Host$env:VSCMD_ARG_HOST_ARCH/$env:VSCMD_ARG_TGT_ARCH/link.exe"
          if (-not (Test-Path $linker)) { throw "Missing Visual Studio linker: $linker" }
          $target = '${{ matrix.rust_target }}'.ToUpper().Replace('-', '_')
          "CARGO_TARGET_${target}_LINKER=$linker" >> $env:GITHUB_ENV
      - uses: msys2/setup-msys2@v2
        id: msys2
        if: matrix.platform == 'windows'
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            git make patch python autoconf automake libtool flex bison perl-JSON
            ${{ matrix.msys_compiler }} ${{ matrix.msys_extra }} ${{ matrix.mingw_prefix }}-cmake
            ${{ matrix.mingw_prefix }}-ninja ${{ matrix.mingw_prefix }}-tools
            ${{ matrix.mingw_prefix }}-vulkan-headers ${{ matrix.mingw_prefix }}-spirv-headers
            ${{ matrix.mingw_prefix }}-librsvg
      - name: Windows native shader libraries
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: bash tools/release/build-native.sh
      - name: Unix native shader libraries
        if: matrix.platform != 'windows' && matrix.platform != 'nix' && matrix.libc != 'musl'
        run: bash tools/release/build-native.sh
      - name: Install direnv
        if: matrix.platform != 'nix' && matrix.libc != 'musl'
        run: |
          mkdir -p "$RUNNER_TEMP/release-tools"
          suffix=''
          if [[ "$RUNNER_OS" == Windows ]]; then suffix=.exe; fi
          curl --fail --location "https://github.com/direnv/direnv/releases/download/v$OPENZT2_DIRENV_VERSION/direnv.${{ matrix.direnv }}" -o "$RUNNER_TEMP/release-tools/direnv$suffix"
          chmod +x "$RUNNER_TEMP/release-tools/direnv$suffix"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"
      - name: Install licence collector
        if: matrix.platform != 'nix' && matrix.libc != 'musl'
        run: cargo install --locked --features cli cargo-about --version 0.9.0
      - name: Windows installer tools
        if: matrix.id == 'windows-amd64'
        shell: pwsh
        run: |
          dotnet tool install --tool-path "$env:RUNNER_TEMP/wix" wix --version '${{ needs.targets.outputs.wix_version }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:RUNNER_TEMP/wix" >> $env:GITHUB_PATH
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin" -Directory | Sort-Object Name -Descending | Where-Object { Test-Path (Join-Path $_.FullName 'x64/makeappx.exe') } | Select-Object -First 1
          if (-not $sdk) { throw 'Windows SDK packaging tools are required.' }
          (Join-Path $sdk.FullName 'x64') >> $env:GITHUB_PATH
      - name: Package Unix release
        if: matrix.platform != 'windows' && matrix.platform != 'nix' && matrix.libc != 'musl'
        run: |
          direnv allow .
          direnv exec . python3 tools/release/package.py package --target '${{ matrix.id }}'
      - name: Package Windows release
        if: matrix.platform == 'windows'
        env:
          OPENZT2_MSIX_CERTIFICATE_BASE64: ${{ github.ref_type == 'tag' && secrets.OPENZT2_MSIX_CERTIFICATE_BASE64 || '' }}
          OPENZT2_MSIX_CERTIFICATE_PASSWORD: ${{ github.ref_type == 'tag' && secrets.OPENZT2_MSIX_CERTIFICATE_PASSWORD || '' }}
          OPENZT2_MSIX_PUBLISHER: ${{ github.ref_type == 'tag' && vars.OPENZT2_MSIX_PUBLISHER || '' }}
        shell: pwsh
        run: |
          $env:XDG_CONFIG_HOME = "$env:RUNNER_TEMP/direnv/config".Replace('\', '/')
          $env:XDG_CACHE_HOME = "$env:RUNNER_TEMP/direnv/cache".Replace('\', '/')
          $env:XDG_DATA_HOME = "$env:RUNNER_TEMP/direnv/data".Replace('\', '/')
          $env:DIRENV_BASH = "$env:ProgramFiles/Git/bin/bash.exe".Replace('\', '/')
          $env:OPENZT2_NATIVE_DEPENDENCY_DIR = $env:OPENZT2_NATIVE_DEPENDENCY_DIR.Replace('\', '/')
          $env:KAI_CARGO_TARGET_ROOT = $env:KAI_CARGO_TARGET_ROOT.Replace('\', '/')
          $mingwBin = Join-Path '${{ steps.msys2.outputs.msys2-location }}' '${{ matrix.mingw_bin }}'
          if (-not (Test-Path $mingwBin)) { throw "Missing MSYS2 tool directory: $mingwBin" }
          $env:PATH = "$mingwBin;" + $env:PATH
          if ('${{ matrix.id }}' -eq 'windows-amd64') {
            foreach ($tool in @('rsvg-convert.exe', 'wix.exe', 'makeappx.exe', 'signtool.exe')) {
              Get-Command $tool -ErrorAction Stop | Select-Object Name, Source
            }
            rsvg-convert.exe --version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if ('${{ matrix.architecture }}' -eq 'arm64') { $env:OPENZT2_OBJDUMP = 'llvm-objdump' }
          direnv allow .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changes = direnv export json | ConvertFrom-Json -AsHashtable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in @('CARGO_TARGET_DIR', 'MOJOSHADER_DIR', 'PKG_CONFIG_PATH', 'LIBRARY_PATH', 'LD_LIBRARY_PATH')) {
            if (-not $changes.ContainsKey($name)) { throw "Missing release environment variable: $name" }
            [Environment]::SetEnvironmentVariable($name, $changes[$name], 'Process')
          }
          python tools/release/package.py package --target '${{ matrix.id }}'
          exit $LASTEXITCODE
      - name: Package Alpine release
        if: matrix.libc == 'musl'
        env:
          OPENZT2_APK_SIGNING_KEY_BASE64: ${{ github.ref_type == 'tag' && secrets.OPENZT2_APK_SIGNING_KEY_BASE64 || '' }}
        run: |
          mkdir -p build/artifacts
          docker run --rm --volume "$PWD:/workspace" --volume "$RUNNER_TEMP:/ci-temp" --workdir /workspace \
            --env RUNNER_TEMP=/ci-temp --env OPENZT2_RUST_VERSION --env CARGO_BUILD_JOBS \
            --env OPENZT2_APK_SIGNING_KEY_BASE64 --env GITHUB_REF_TYPE \
            --env OPENZT2_RELEASE_TARGET --env OPENZT2_RELEASE_ARCH \
            '${{ needs.targets.outputs.alpine_image }}' \
            sh -ec 'apk add --no-cache bash; exec bash tools/release/alpine/build.sh'
      - uses: cachix/install-nix-action@v31
        if: matrix.platform == 'nix'
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 1
            cores = 4
      - name: Package Nix closure
        if: matrix.platform == 'nix'
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          bash tools/release/nix/export-package.sh
      - name: Stage declared release artifacts
        run: python3 tools/release/release_targets.py stage '${{ matrix.id }}'
      - name: Preserve Windows packages after installer failure
        if: failure() && matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: failed-package-${{ matrix.id }}
          path: build/releases/${{ matrix.id }}/*.zip
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: OpenZT2-${{ github.event_name == 'pull_request' && format('pr-{0}-', github.event.number) || '' }}${{ matrix.id }}
          path: build/artifacts/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 90 || 14 }}

  publish:
    needs: [targets, package]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: OpenZT2-*
          path: artifacts
      - name: Collect declared packages and checksums
        run: python3 tools/release/release_targets.py collect artifacts release
      - name: Publish tagged release
        run: |
          options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease --latest=false); fi
          cat > release-notes.md <<EOF
          OpenZT2 is in early development and requires your own Zoo Tycoon 2 Ultimate Collection game files.

          The [package guide](https://github.com/$GH_REPO/blob/$RELEASE_TAG/tools/release/README.md) covers installation and runtime requirements.
          EOF
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
            --notes-file release-notes.md "${options[@]}" release/*
