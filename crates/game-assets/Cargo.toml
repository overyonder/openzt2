[package]
name = "openzt2_game_assets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
testing = []

[lints]
workspace = true

[dependencies]
openzt2_game_data.workspace = true

d3d9-effects.workspace = true
z2f.workspace = true
futures-lite = "2.6"
dirs.workspace = true
chrono.workspace = true
ron.workspace = true
postcard.workspace = true
arrayvec.workspace = true
async-channel = "2.5"
anyhow = "1.0"
avian3d.workspace = true
bevy_hanabi.workspace = true
blake3.workspace = true
ico = "0.5"
image.workspace = true
image_dds = { version = "0.7", default-features = false, features = ["ddsfile", "image"] }
lunify = "1.1"
mlua.workspace = true
quick-xml = { version = "0.38", features = ["serialize"] }
rayon = "1.11"
roxmltree = "0.20"
smol_str.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror = "2.0"
gltf = { version = "1.4", default-features = false, features = ["extras", "names"] }
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
ureq.workspace = true
bevy.workspace = true

# Apple's wgpu backend is Metal; raw Vulkan initialization is unavailable there.
[target.'cfg(not(target_vendor = "apple"))'.dependencies]
bevy = { workspace = true, features = ["raw_vulkan_init"] }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
zip.workspace = true
