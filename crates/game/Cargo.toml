[package]
name = "openzt2_game"
default-run = "openzt2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = []
trace-tracy-gpu = ["bevy/trace", "bevy/trace_tracy", "bevy/debug"]
trace-tracy-memory = ["bevy/trace", "bevy/trace_tracy_memory", "bevy/debug"]
dev-tools = [
    "dep:bevy-inspector-egui",
    "bevy/bevy_dev_tools",
    "bevy/bevy_ui_debug",
    "bevy/track_location",
    "bevy/debug",
    "bevy/picking",
    "avian3d/bevy_diagnostic",
    "avian3d/debug-plugin",
    "avian3d/diagnostic_ui",
]

[lints]
workspace = true

[[bin]]
name = "openzt2"
path = "src/main.rs"

[dependencies]
openzt2_animals.workspace = true
openzt2_aquatic.workspace = true
openzt2_audio.workspace = true
openzt2_construction.workspace = true
openzt2_economy.workspace = true
openzt2_environment.workspace = true
openzt2_extinct_animals.workspace = true
openzt2_game_assets.workspace = true
openzt2_information.workspace = true
openzt2_interface_state.workspace = true
openzt2_navigation.workspace = true
openzt2_photos.workspace = true
openzt2_player_controls.workspace = true
openzt2_progression.workspace = true
openzt2_session.workspace = true
openzt2_settings.workspace = true
openzt2_shows.workspace = true
openzt2_simulation_time.workspace = true
openzt2_staff_requests.workspace = true
openzt2_terrain.workspace = true
openzt2_transport.workspace = true
openzt2_ui.workspace = true
openzt2_visitors.workspace = true
openzt2_world.workspace = true
openzt2_world_state.workspace = true
openzt2_zoo_staff.workspace = true
openzt2_zoo_state.workspace = true

z2f.workspace = true
avian3d.workspace = true
bevy.workspace = true
bevy_hanabi.workspace = true
bevy-inspector-egui = { version = "0.37", optional = true }
dirs.workspace = true

# Apple's wgpu backend is Metal; raw Vulkan initialization is unavailable there.
[target.'cfg(not(target_vendor = "apple"))'.dependencies]
bevy = { workspace = true, features = ["raw_vulkan_init"] }

[dev-dependencies]
openzt2_game_assets = { workspace = true, features = ["testing"] }
