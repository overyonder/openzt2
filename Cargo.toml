[workspace]
members = [
    "crates/animals",
    "crates/aquatic",
    "crates/audio",
    "crates/construction",
    "crates/d3d9-effects",
    "crates/economy",
    "crates/environment",
    "crates/extinct-animals",
    "crates/game-assets",
    "crates/game-data",
    "crates/game",
    "crates/information",
    "crates/interface-state",
    "crates/navigation",
    "crates/photos",
    "crates/player-controls",
    "crates/progression",
    "crates/session",
    "crates/settings",
    "crates/shows",
    "crates/simulation-time",
    "crates/staff-requests",
    "crates/terrain",
    "crates/transport",
    "crates/ui",
    "crates/visitors",
    "crates/world-state",
    "crates/world",
    "crates/z2f",
    "crates/zoo-staff",
    "crates/zoo-state",
]
default-members = ["crates/game"]
# Keep upstream code out of first-party workspace checks while allowing its
# focused GPU-resource tests to run through its own manifest.
exclude = ["vendor/bevy_render", "vendor/bevy_image", "vendor/lunify", "vendor/taffy"]
resolver = "3"

[workspace.package]
version = "1.1.3-beta"
edition = "2021"
rust-version = "1.96"
publish = false
license = "MIT"

[workspace.dependencies]
openzt2_animals = { path = "crates/animals" }
openzt2_aquatic = { path = "crates/aquatic" }
openzt2_audio = { path = "crates/audio" }
openzt2_construction = { path = "crates/construction" }
openzt2_economy = { path = "crates/economy" }
openzt2_environment = { path = "crates/environment" }
openzt2_extinct_animals = { path = "crates/extinct-animals" }
openzt2_game = { path = "crates/game" }
openzt2_game_assets = { path = "crates/game-assets" }
openzt2_game_data = { path = "crates/game-data" }
openzt2_information = { path = "crates/information" }
openzt2_interface_state = { path = "crates/interface-state" }
openzt2_navigation = { path = "crates/navigation" }
openzt2_photos = { path = "crates/photos" }
openzt2_player_controls = { path = "crates/player-controls" }
openzt2_progression = { path = "crates/progression" }
openzt2_session = { path = "crates/session" }
openzt2_settings = { path = "crates/settings" }
openzt2_shows = { path = "crates/shows" }
openzt2_simulation_time = { path = "crates/simulation-time" }
openzt2_staff_requests = { path = "crates/staff-requests" }
openzt2_terrain = { path = "crates/terrain" }
openzt2_transport = { path = "crates/transport" }
openzt2_ui = { path = "crates/ui" }
openzt2_visitors = { path = "crates/visitors" }
openzt2_world = { path = "crates/world" }
openzt2_world_state = { path = "crates/world-state" }
openzt2_zoo_staff = { path = "crates/zoo-staff" }
openzt2_zoo_state = { path = "crates/zoo-state" }

d3d9-effects = { path = "crates/d3d9-effects" }
z2f = { path = "crates/z2f" }
arrayvec = "0.7"
avian3d = { version = "0.7", default-features = false, features = ["3d", "f32", "parry-f32", "collider-from-mesh"] }
bevy_hanabi = { version = "0.19", default-features = false, features = ["3d"] }
blake3 = "1.8"
chrono = { version = "0.4", default-features = false, features = ["std"] }
dirs = "7"
image = { version = "0.25", default-features = false, features = ["bmp", "ico", "jpeg", "png", "tga"] }
mlua = { version = "0.11", features = ["lua51", "vendored"] }
num-integer = "0.1.47"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
ron = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol_str = "0.2"
ureq = { version = "3.3", default-features = false, features = ["json", "rustls"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
zip = { version = "4.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
bevy = { version = "0.19.0", default-features = false, features = [
    "default_app",
    "std",
    "multi_threaded",
    "async_executor",
    "async-io",
    "bevy_winit",
    "bevy_gilrs",
    "wayland",
    "default_font",
    "system_font_discovery",
    "3d_bevy_render",
    "bevy_scene",
    "ui_bevy_render",
    "bevy_ui_widgets",
    "bevy_picking",
    "mesh_picking",
    "custom_cursor",
    "keyboard",
    "mouse",
    "touch",
    "serialize",
    "audio",
    "mp3",
    "vorbis",
    "wav",
    "dds",
    "jpeg",
    "shader_format_spirv",
    "bmp",
    "png",
    "tga",
] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
cargo = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
large_enum_variant = "deny"
too_many_arguments = "deny"
type_complexity = "deny"

[profile.dev]
# Fast first-party edit/build cycles. Dependencies retain optimization below so
# Bevy, Avian, and codecs remain representative enough for interactive use.
opt-level = 1
debug = 1
incremental = true
codegen-units = 256
lto = "off"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
debug = 0
incremental = false
codegen-units = 1
lto = "thin"
strip = "symbols"

[profile.profiling]
# Keep optimized code and profiling symbols without whole-program LTO.
inherits = "release"
lto = "off"
debug = 1
strip = "none"

[patch.crates-io]
taffy = { path = "vendor/taffy" }
# Stripped Lua chunks retain executable instructions and closure upvalue counts.
lunify = { path = "vendor/lunify" }
# Preserve legacy 24-bit DDS BGR channel order during alpha expansion.
bevy_image = { path = "vendor/bevy_image" }
# Reuse wgpu staging allocations for repeated ShaderBuffer uploads.
bevy_render = { path = "vendor/bevy_render" }
# Narrow tracked extension: per-instance effect delta time. Hanabi remains the
# sole particle simulator and renderer; OpenZT2 does not own a particle runtime.
bevy_hanabi = { path = "vendor/bevy_hanabi" }
