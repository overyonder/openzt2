[package]
name = "bevy_audio"
version = "0.20.0-dev"
edition = "2024"
description = "Provides audio functionality for Bevy Engine"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]

[dependencies]
# bevy
bevy_app = { git = "https://github.com/bevyengine/bevy", rev = "2e26874eb1a0f61ffd57d268be4e4725fe8cd4e2", version = "0.20.0-dev" }
bevy_asset = { git = "https://github.com/bevyengine/bevy", rev = "2e26874eb1a0f61ffd57d268be4e4725fe8cd4e2", version = "0.20.0-dev" }
bevy_ecs = { git = "https://github.com/bevyengine/bevy", rev = "2e26874eb1a0f61ffd57d268be4e4725fe8cd4e2", version = "0.20.0-dev" }
bevy_math = { git = "https://github.com/bevyengine/bevy", rev = "2e26874eb1a0f61ffd57d268be4e4725fe8cd4e2", version = "0.20.0-dev" }
bevy_reflect = { git = "https://github.com/bevyengine/bevy", rev = "2e26874eb1a0f61ffd57d268be4e4725fe8cd4e2", version = "0.20.0-dev" }
bevy_transform = { git = "https://github.com/bevyengine/bevy", rev = "2e26874eb1a0f61ffd57d268be4e4725fe8cd4e2", version = "0.20.0-dev" }

# other
rodio = { version = "0.22", default-features = false, features = [
  "playback",
  "tracing",
] }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# TODO: Assuming all wasm builds are for the browser. Require `no_std` support to break assumption.
rodio = { version = "0.22", default-features = false, features = [
  "wasm-bindgen",
  "playback",
] }
bevy_app = { git = "https://github.com/bevyengine/bevy", rev = "2e26874eb1a0f61ffd57d268be4e4725fe8cd4e2", version = "0.20.0-dev", default-features = false, features = [
  "web",
] }
bevy_reflect = { git = "https://github.com/bevyengine/bevy", rev = "2e26874eb1a0f61ffd57d268be4e4725fe8cd4e2", version = "0.20.0-dev", default-features = false, features = [
  "web",
] }

[features]
aac = ["rodio/symphonia-aac"]
flac = ["rodio/claxon"]
mp3 = ["rodio/mp3"]
mp4 = ["rodio/mp4"]
vorbis = ["rodio/lewton"]
wav = ["rodio/hound"]
symphonia-flac = ["rodio/flac"]
symphonia-vorbis = ["rodio/vorbis"]
symphonia-wav = ["rodio/wav"]

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
