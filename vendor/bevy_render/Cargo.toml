[package]
name = "bevy_render"
version = "0.20.0-dev"
edition = "2024"
description = "Provides rendering functionality for Bevy Engine"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]

[features]
multi_threaded = ["bevy_tasks/multi_threaded", "bevy_transform/multi_threaded"]

morph = ["bevy_mesh/morph"]

shader_format_spirv = ["wgpu/spirv"]

# Enable SPIR-V shader passthrough
spirv_shader_passthrough = ["wgpu/spirv"]

# Statically linked DXC shader compiler for DirectX 12
# TODO: When wgpu switches to DirectX 12 instead of Vulkan by default on windows, make this a default feature
statically-linked-dxc = ["wgpu/static-dxc"]

# Forces the wgpu instance to be initialized using the raw Vulkan HAL, enabling additional configuration
raw_vulkan_init = ["wgpu/vulkan"]

trace = ["profiling"]
tracing-tracy = ["dep:tracy-client"]
ci_limits = []
webgl = ["wgpu/webgl"]
webgpu = ["wgpu/webgpu"]
vulkan-portability = ["wgpu/vulkan-portability"]
gles = ["wgpu/gles"]
detailed_trace = []
# Pre-populate buffer labels with buffer types for debugging.
type_label_buffers = []
# Enables collecting extra information for debugging.
debug = ["type_label_buffers", "bevy_utils/debug"]
## Adds serialization support through `serde`.
serialize = ["bevy_mesh/serialize"]

reflect_auto_register = ["bevy_app/reflect_auto_register"]
reflect_functions = ["bevy_app/reflect_functions"]

[dependencies]
# bevy
bevy_app = { version = "=0.20.0-dev" }
bevy_asset = { version = "=0.20.0-dev" }
bevy_color = { version = "=0.20.0-dev", features = [
  "serialize",
  "wgpu-types",
] }
bevy_derive = { version = "=0.20.0-dev" }
bevy_diagnostic = { version = "=0.20.0-dev" }
bevy_ecs = { version = "=0.20.0-dev" }
bevy_encase_derive = { version = "=0.20.0-dev" }
bevy_extract = { version = "=0.20.0-dev" }
bevy_extract_macros = { version = "=0.20.0-dev" }
bevy_math = { version = "=0.20.0-dev" }
bevy_material = { version = "=0.20.0-dev" }
bevy_reflect = { version = "=0.20.0-dev" }
bevy_log = { version = "=0.20.0-dev" }
bevy_material_macros = { version = "=0.20.0-dev" }
bevy_render_macros = { version = "=0.20.0-dev" }
bevy_shape = { version = "=0.20.0-dev" }
bevy_time = { version = "=0.20.0-dev" }
bevy_transform = { version = "=0.20.0-dev" }
bevy_window = { version = "=0.20.0-dev" }
bevy_utils = { version = "=0.20.0-dev" }
bevy_tasks = { version = "=0.20.0-dev" }
bevy_image = { version = "=0.20.0-dev" }
bevy_mesh = { version = "=0.20.0-dev" }
bevy_camera = { version = "=0.20.0-dev" }
bevy_shader = { version = "=0.20.0-dev" }
bevy_platform = { version = "=0.20.0-dev", default-features = false, features = [
  "std",
  "serialize",
  "bytemuck",
] }

# rendering
image = { version = "0.25.2", default-features = false }

# misc
# `fragile-send-sync-non-atomic-wasm` feature means we can't use Wasm threads for rendering
# It is enabled for now to avoid having to do a significant overhaul of the renderer just for wasm.
# When the 'atomics' feature is enabled `fragile-send-sync-non-atomic` does nothing
# and Bevy instead wraps `wgpu` types to verify they are not used off their origin thread.
wgpu = { version = "30", default-features = false, features = [
  "wgsl",
  "dx12",
  "metal",
  "vulkan",
  "fragile-send-sync-non-atomic-wasm",
] }
wgpu-types = { version = "30", default-features = false }
bytemuck = { version = "1.5", features = ["derive", "must_cast"] }
downcast-rs = { version = "2", default-features = false, features = ["std"] }
thiserror = { version = "2", default-features = false }
derive_more = { version = "2", default-features = false, features = ["from"] }
encase = "0.13"
glam = { version = "0.33.9", default-features = false, features = [
  "std",
  "encase-013",
] }
# For wgpu profiling using tracing. Use `RUST_LOG=info` to also capture the wgpu spans.
profiling = { version = "1", features = [
  "profile-with-tracing",
], optional = true }
async-channel = "2.3.0"
nonmax = "0.5"
smallvec = { version = "1", default-features = false, features = ["const_new"] }
offset-allocator = "0.2"
variadics_please = "2.0"
tracy-client = { version = "0.19.0", optional = true }
indexmap = { version = "2" }
bitflags = "2"
itertools = "0.14"
weak-table = "0.4"
tracing = "0.1"
static_assertions = "1"

[dev-dependencies]
proptest = "1"
proptest-derive = "0.8"
# noop backend used for tests via test_utils.rs
wgpu = { version = "30", default-features = false, features = ["noop"] }

[target.'cfg(all(target_arch = "wasm32", target_feature = "atomics"))'.dependencies]
send_wrapper = { version = "0.6.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.83"
web-sys = { version = "0.3.67", features = [
  'Blob',
  'Document',
  'Element',
  'HtmlElement',
  'Node',
  'Url',
  'Window',
] }
wasm-bindgen = "0.2"
# TODO: Assuming all wasm builds are for the browser. Require `no_std` support to break assumption.
bevy_app = { version = "=0.20.0-dev", default-features = false, features = [
  "web",
] }
bevy_platform = { version = "=0.20.0-dev", default-features = false, features = [
  "web",
] }
bevy_reflect = { version = "=0.20.0-dev", default-features = false, features = [
  "web",
] }


[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true

[package.metadata.wgsl-analyzer]
edition = "2026_pre"
root = "src"

[lints.clippy]
doc_markdown = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
type_complexity = "allow"
undocumented_unsafe_blocks = "warn"
unwrap_or_default = "warn"
needless_lifetimes = "allow"
too_many_arguments = "allow"
nonstandard_macro_braces = "warn"
print_stdout = "warn"
print_stderr = "warn"

ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"

# see: https://github.com/bevyengine/bevy/pull/15375#issuecomment-2366966219
too_long_first_doc_paragraph = "allow"

# currently falsely fires on std::io, even tho core::io is unstable
# https://github.com/rust-lang/rust-clippy/issues/13158#issuecomment-4373196346
std_instead_of_core = "allow"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"

allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[lints.rust]
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs_dep)'] }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"
