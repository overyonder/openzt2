[package]
name = "bevy_pbr"
version = "0.20.0-dev"
edition = "2024"
description = "Adds PBR rendering to Bevy Engine"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]

[features]
webgl = ["bevy_light/webgl"]
webgpu = ["bevy_light/webgpu"]
pbr_transmission_textures = ["bevy_gltf?/pbr_transmission_textures"]
pbr_multi_layer_material_textures = [
  "bevy_gltf?/pbr_multi_layer_material_textures",
]
pbr_anisotropy_texture = ["bevy_gltf?/pbr_anisotropy_texture"]
pbr_specular_textures = ["bevy_gltf?/pbr_specular_textures"]
experimental_pbr_pcss = ["bevy_light/experimental_pbr_pcss"]
pbr_clustered_decals = []
pbr_light_textures = []
bluenoise_texture = ["bevy_image/ktx2", "bevy_image/zstd"]
dfg_lut = ["bevy_image/ktx2", "bevy_image/zstd"]
area_light_luts = ["bevy_image/ktx2", "bevy_image/zstd"]
trace = ["bevy_render/trace"]
# Enables the meshlet renderer for dense high-poly scenes (experimental)
meshlet = ["dep:lz4_flex", "dep:range-alloc"]
# Enables processing meshes into meshlet meshes
meshlet_processor = [
  "meshlet",
  "dep:meshopt",
  "dep:metis",
  "dep:itertools",
  "dep:bitvec",
]

[dependencies]
# bevy
bevy_app = { version = "=0.20.0-dev" }
bevy_asset = { version = "=0.20.0-dev" }
bevy_color = { version = "=0.20.0-dev" }
bevy_core_pipeline = { version = "=0.20.0-dev" }
bevy_derive = { version = "=0.20.0-dev" }
bevy_diagnostic = { version = "=0.20.0-dev" }
bevy_ecs = { version = "=0.20.0-dev" }
bevy_extract = { version = "=0.20.0-dev" }
bevy_gltf = { version = "=0.20.0-dev", optional = true }
bevy_light = { version = "=0.20.0-dev" }
bevy_log = { version = "=0.20.0-dev" }
bevy_image = { version = "=0.20.0-dev" }
bevy_mesh = { version = "=0.20.0-dev", features = [
  "morph",
  "bevy_mikktspace",
] }
bevy_shader = { version = "=0.20.0-dev" }
bevy_material = { version = "=0.20.0-dev" }
bevy_math = { version = "=0.20.0-dev" }
bevy_shape = { version = "=0.20.0-dev" }
bevy_reflect = { version = "=0.20.0-dev" }
bevy_render = { version = "=0.20.0-dev", features = [
  "morph",
] }
bevy_camera = { version = "=0.20.0-dev" }
bevy_tasks = { version = "=0.20.0-dev" }
bevy_transform = { version = "=0.20.0-dev" }
bevy_utils = { version = "=0.20.0-dev" }
bevy_platform = { version = "=0.20.0-dev", default-features = false, features = [
  "std",
] }

# other
bitflags = { version = "2.3", features = ["bytemuck"] }
fixedbitset = "0.5"
thiserror = { version = "2", default-features = false }
derive_more = { version = "2", default-features = false, features = ["from"] }
# meshlet
lz4_flex = { version = "0.14", default-features = false, features = [
  "frame",
], optional = true }
range-alloc = { version = "0.1", optional = true }
meshopt = { version = "0.6.2", optional = true }
metis = { version = "0.2.2", optional = true }
itertools = { version = "0.14", optional = true }
bitvec = { version = "1", optional = true }
# direct dependency required for derive macro
bytemuck = { version = "1", features = ["derive", "must_cast"] }
smallvec = { version = "1", default-features = false }
nonmax = "0.5"
static_assertions = "1"
tracing = { version = "0.1", default-features = false, features = ["std"] }
offset-allocator = "0.2"
arrayvec = { version = "0.7", default-features = false }
indexmap = { version = "2" }
wgpu-types = "30"

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
features = ["bevy_image/zstd_rust"]

[package.metadata.wgsl-analyzer]
edition = "2026_pre"
root = "src"

[lints.clippy]
doc_markdown = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
type_complexity = "allow"
undocumented_unsafe_blocks = "warn"
unwrap_or_default = "warn"
needless_lifetimes = "allow"
too_many_arguments = "allow"
nonstandard_macro_braces = "warn"
print_stdout = "warn"
print_stderr = "warn"

ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"

# see: https://github.com/bevyengine/bevy/pull/15375#issuecomment-2366966219
too_long_first_doc_paragraph = "allow"

# currently falsely fires on std::io, even tho core::io is unstable
# https://github.com/rust-lang/rust-clippy/issues/13158#issuecomment-4373196346
std_instead_of_core = "allow"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"

allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[lints.rust]
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs_dep)'] }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"
