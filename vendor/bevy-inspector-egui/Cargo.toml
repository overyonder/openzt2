[package]
edition = "2024"
name = "bevy-inspector-egui"
version = "0.38.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Inspector plugin for the bevy game engine"
documentation = "https://docs.rs/bevy-inspector-egui-derive"
readme = "README.md"
keywords = [
    "bevy",
    "inspector",
    "egui",
    "editor",
    "reflect",
]
categories = [
    "game-development",
    "gui",
    "visualization",
    "development-tools::procedural-macro-helpers",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jakobhellermann/bevy-inspector-egui/"
resolver = "2"

[package.metadata.docs.rs]
features = ["winit/x11"]

[features]
2d = [
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_camera",
    "bevy_image",
    "bevy_mesh",
]
3d = [
    "bevy_light",
    "bevy_mikktspace",
    "bevy_pbr",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_camera",
    "bevy_image",
    "bevy_mesh",
]
bevy = [
    "2d",
    "3d",
    "bevy_gizmos",
]
bevy_camera = ["dep:bevy_camera"]
bevy_core_pipeline = ["dep:bevy_core_pipeline"]
bevy_gizmos = ["dep:bevy_gizmos"]
bevy_image = [
    "dep:bevy_image",
    "bevy_render",
]
bevy_light = ["dep:bevy_light"]
bevy_mesh = ["dep:bevy_mesh"]
bevy_mikktspace = ["dep:bevy_mikktspace"]
bevy_pbr = ["dep:bevy_pbr"]
bevy_render = [
    "dep:bevy_render",
    "bevy_egui/render",
]
default = [
    "documentation",
    "bevy",
    "egui_clipboard",
]
documentation = ["bevy_reflect/reflect_documentation"]
egui_clipboard = ["bevy_egui/manage_clipboard"]
egui_open_url = ["bevy_egui/open_url"]
highlight_changes = []

[lib]
name = "bevy_inspector_egui"
path = "src/lib.rs"

[dependencies.bevy-inspector-egui-derive]
version = "0.38"

[dependencies.bevy_app]
version = "=0.20.0-dev"

[dependencies.bevy_asset]
version = "=0.20.0-dev"

[dependencies.bevy_camera]
version = "=0.20.0-dev"
optional = true

[dependencies.bevy_color]
version = "=0.20.0-dev"

[dependencies.bevy_core_pipeline]
version = "=0.20.0-dev"
optional = true

[dependencies.bevy_ecs]
version = "=0.20.0-dev"

[dependencies.bevy_egui]
version = "0.43.0"
default-features = false

[dependencies.bevy_gizmos]
version = "=0.20.0-dev"
optional = true

[dependencies.bevy_image]
version = "=0.20.0-dev"
optional = true

[dependencies.bevy_light]
version = "=0.20.0-dev"
optional = true

[dependencies.bevy_log]
version = "=0.20.0-dev"

[dependencies.bevy_math]
version = "=0.20.0-dev"

[dependencies.bevy_mesh]
version = "=0.20.0-dev"
optional = true

[dependencies.bevy_mikktspace]
version = "1.0"
optional = true

[dependencies.bevy_pbr]
version = "=0.20.0-dev"
optional = true

[dependencies.bevy_platform]
version = "=0.20.0-dev"

[dependencies.bevy_reflect]
version = "=0.20.0-dev"

[dependencies.bevy_render]
version = "=0.20.0-dev"
optional = true

[dependencies.bevy_state]
version = "=0.20.0-dev"

[dependencies.bevy_time]
version = "=0.20.0-dev"

[dependencies.bevy_utils]
version = "=0.20.0-dev"

[dependencies.bevy_window]
version = "=0.20.0-dev"

[dependencies.bytemuck]
version = "1.16.0"

[dependencies.disqualified]
version = "1.0.0"

[dependencies.egui]
version = "0.36"

[dependencies.fuzzy-matcher]
version = "0.3.7"

[dependencies.image]
version = "0.25"
default-features = false

[dependencies.opener]
version = "0.9"

[dependencies.smallvec]
version = "1.10"

[dependencies.uuid]
version = "1.21.0"

[dependencies.winit]
version = "0.30.0"
default-features = false

[dev-dependencies.bevy]
version = "=0.20.0-dev"
features = [
    "std",
    "x11",
    "wayland",
    "reflect_auto_register",
    "bevy_log",
    "bevy_winit",
    "bevy_state",
    "bevy_window",
    "bevy_pbr",
    "bevy_sprite",
    "bevy_text",
    "bevy_core_pipeline",
    "bevy_picking",
    "bevy_gizmos",
    "mesh_picking",
    "gltf_animation",
    "png",
    "zstd_rust",
    "tonemapping_luts",
    "ktx2",
]
default-features = false

[dev-dependencies.bevy_math]
version = "=0.20.0-dev"
features = ["mint"]

[dev-dependencies.egui_dock]
version = "0.21.1"
