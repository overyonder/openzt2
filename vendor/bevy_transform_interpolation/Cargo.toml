[package]
edition = "2024"
name = "bevy_transform_interpolation"
version = "0.6.0"
authors = ["Joona Aalto <jondolf.dev@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Transform interpolation for fixed timesteps for the Bevy game engine"
documentation = "https://docs.rs/bevy_transform_interpolation"
readme = "README.md"
keywords = [
    "gamedev",
    "interpolation",
    "easing",
    "bevy",
]
categories = ["game-development"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Jondolf/bevy_transform_interpolation"

[features]
critical-section = ["bevy/critical-section"]
default = ["std"]
libm = ["bevy/libm"]
serialize = [
    "dep:serde",
    "bevy/serialize",
]
std = ["bevy/std"]

[lib]
name = "bevy_transform_interpolation"
path = "src/lib.rs"

[dependencies.bevy]
version = "=0.20.0-dev"
default-features = false

[dependencies.serde]
version = "1.0"
optional = true
default-features = false

[dev-dependencies.bevy]
version = "=0.20.0-dev"
features = [
    "2d",
    "ui",
]
default-features = false

[lints.clippy]
alloc_instead_of_core = "warn"
std_instead_of_alloc = "warn"
std_instead_of_core = "warn"
