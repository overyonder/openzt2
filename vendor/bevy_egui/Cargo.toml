[package]
edition = "2024"
rust-version = "1.95.0"
name = "bevy_egui"
version = "0.43.1"
authors = ["vladbat00 <vladyslav.batyrenko@gmail.com>"]
build = false
exclude = [
    "assets/**/*",
    ".github/**/*",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A plugin for Egui integration into Bevy"
readme = "README.md"
license = "MIT"
repository = "https://github.com/vladbat00/bevy_egui"

[package.metadata.docs.rs]
features = [
    "bevy_winit/x11",
    "immutable_ctx",
]

[features]
accesskit = ["bevy_a11y"]
bevy_ui = [
    "bevy_ui_render",
    "render",
]
default = [
    "manage_clipboard",
    "open_url",
    "default_fonts",
    "render",
    "bevy_ui",
    "picking",
]
default_fonts = ["egui/default_fonts"]
immutable_ctx = []
log_file_dnd_messages = []
log_input_messages = []
manage_clipboard = [
    "arboard",
    "thread_local",
    "bytemuck",
    "egui/bytemuck",
    "smithay-clipboard",
]
open_url = ["webbrowser"]
picking = [
    "render",
    "bevy_picking",
]
render = [
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_extract",
    "bevy_image",
    "bevy_mesh",
    "bevy_render",
    "bevy_color",
    "bevy_shader",
    "bevy_transform",
    "encase",
    "bytemuck",
    "egui/bytemuck",
    "wgpu-types",
    "itertools",
]
serde = ["egui/serde"]

[lib]
name = "bevy_egui"
path = "src/lib.rs"

[dependencies.bevy_a11y]
version = "=0.20.0-dev"
optional = true

[dependencies.bevy_app]
version = "=0.20.0-dev"

[dependencies.bevy_asset]
version = "=0.20.0-dev"
optional = true

[dependencies.bevy_camera]
version = "=0.20.0-dev"

[dependencies.bevy_color]
version = "=0.20.0-dev"
optional = true

[dependencies.bevy_core_pipeline]
version = "=0.20.0-dev"
optional = true

[dependencies.bevy_derive]
version = "=0.20.0-dev"

[dependencies.bevy_ecs]
version = "=0.20.0-dev"

[dependencies.bevy_extract]
version = "=0.20.0-dev"
optional = true

[dependencies.bevy_image]
version = "=0.20.0-dev"
features = ["zstd_rust"]
optional = true

[dependencies.bevy_input]
version = "=0.20.0-dev"

[dependencies.bevy_log]
version = "=0.20.0-dev"

[dependencies.bevy_math]
version = "=0.20.0-dev"

[dependencies.bevy_mesh]
version = "=0.20.0-dev"
optional = true

[dependencies.bevy_picking]
version = "=0.20.0-dev"
features = ["mesh_picking"]
optional = true

[dependencies.bevy_platform]
version = "=0.20.0-dev"

[dependencies.bevy_reflect]
version = "=0.20.0-dev"

[dependencies.bevy_render]
version = "=0.20.0-dev"
optional = true

[dependencies.bevy_shader]
version = "=0.20.0-dev"
optional = true

[dependencies.bevy_shape]
version = "=0.20.0-dev"

[dependencies.bevy_time]
version = "=0.20.0-dev"

[dependencies.bevy_transform]
version = "=0.20.0-dev"
optional = true

[dependencies.bevy_ui_render]
version = "=0.20.0-dev"
optional = true

[dependencies.bevy_utils]
version = "=0.20.0-dev"
features = ["debug"]

[dependencies.bevy_window]
version = "=0.20.0-dev"

[dependencies.bevy_winit]
version = "=0.20.0-dev"

[dependencies.bytemuck]
version = "1"
optional = true

[dependencies.egui]
version = "0.36"
default-features = false

[dependencies.encase]
version = "0.13"
optional = true

[dependencies.itertools]
version = "0.15"
optional = true

[dependencies.webbrowser]
version = "1.0.1"
optional = true

[dependencies.wgpu-types]
version = "30.0.1"
optional = true

[dependencies.winit]
version = "0.30"
default-features = false

[dev-dependencies.bevy]
version = "=0.20.0-dev"
features = [
    "bevy_log",
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_pbr",
    "mesh_picking",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_text",
    "bevy_ui_render",
    "bevy_window",
    "bevy_winit",
    "mouse",
    "keyboard",
    "touch",
    "gestures",
    "android-game-activity",
    "png",
    "std",
    "tonemapping_luts",
    "webgl2",
    "x11",
    "zstd_rust",
]
default-features = false

[dev-dependencies.egui]
version = "0.36"
features = ["bytemuck"]
default-features = false

[dev-dependencies.version-sync]
version = "0.9.5"

[target.'cfg(any(target_os="linux", target_os="dragonfly", target_os="freebsd", target_os="netbsd", target_os="openbsd"))'.dependencies.smithay-clipboard]
version = "0.7.2"
optional = true

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies.arboard]
version = "3.2.0"
optional = true

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies.thread_local]
version = "1.1.0"
optional = true

[target.'cfg(not(any(target_os = "android", target_os = "ios", target_arch = "wasm32")))'.dev-dependencies.rfd]
version = "0.17"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies.bevy]
version = "=0.20.0-dev"
features = ["accesskit_unix"]
default-features = false

[target.'cfg(target_arch = "wasm32")'.dependencies.crossbeam-channel]
version = "0.5.8"

[target.'cfg(target_arch = "wasm32")'.dependencies.getrandom]
version = "0.4"
features = ["wasm_js"]

[target.'cfg(target_arch = "wasm32")'.dependencies.image]
version = "0.25.5"
features = ["png"]
default-features = false

[target.'cfg(target_arch = "wasm32")'.dependencies.js-sys]
version = "0.3.63"

[target.'cfg(target_arch = "wasm32")'.dependencies.wasm-bindgen]
version = "0.2.93"

[target.'cfg(target_arch = "wasm32")'.dependencies.wasm-bindgen-futures]
version = "0.4.36"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3.74"
features = [
    "Clipboard",
    "ClipboardEvent",
    "ClipboardItem",
    "CompositionEvent",
    "DataTransfer",
    "Document",
    "EventTarget",
    "HtmlInputElement",
    "InputEvent",
    "KeyboardEvent",
    "Navigator",
    "TouchEvent",
    "Window",
]
